<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captcha verification</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="box">
       <div class="captcha" id = "captcha"> </div>
    <button class="refresh-btn"  onclick="generateCaptcha()">&#8635</button> <br>
    <input type="text" id = "input" placeholder="ENTER CAPTCHA">
    <div class="btn"> <button onclick="checkCaptcha()">Submit</button></div>
    <p id="result"></p>
    </div>
 

<script>
    let captcha;
   function generateCaptcha() {
    const chars = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
    captcha ='';
    for (let i = 0; i < 5; i++)
   {
    captcha +=  chars.charAt(Math.floor(Math.random() * chars.length));
   }
    document.getElementById('captcha').innerText = captcha;
   }
    function checkCaptcha()
{
    let input = document.getElementById('input').value;
    if (input === captcha)
{
    document.getElementById('result').innerText = "Correct!";
    alert("Congrates, You are correct!☺");
}
else{
    document.getElementById("result").innerText = "Incorrect";
    alert("Incorrect! Try again.🙃");
}
generateCaptcha(); 
    document.getElementById('input').value = '';
}
window.onload = generateCaptcha;
</script>
    
</body>
</html>
